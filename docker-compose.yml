services:
  barkprints:
    build:
      context: .
      dockerfile: Dockerfile
    image: barkprints:local
    container_name: barkprints
    # Exposed only on localhost for verification; public access is via the
    # existing soundmap Caddy (shared soundmap_web network) over HTTPS.
    ports:
      - "127.0.0.1:5051:8000"
    networks:
      - soundmap_web
    environment:
      # Secure cookies are safe here: the app is only ever reached over HTTPS
      # via Caddy. Set BARKPRINTS_SECRET_KEY to a fixed value to keep sessions
      # valid across container recreation (otherwise a key is persisted in the
      # data volume automatically).
      BARKPRINTS_COOKIE_SECURE: "1"
    volumes:
      # SQLite DB + uploaded photos + signing key. Survives `up -d --build`.
      - barkprints_data:/app/data
    restart: unless-stopped

# The reverse proxy (and its 80/443 binding) already lives in the soundmap
# stack. We attach to that network so Caddy can reach this container by name.
networks:
  soundmap_web:
    external: true

volumes:
  barkprints_data:
