[project]
name = "barkprints"
version = "0.1.0"
description = "Generate poetry and text from tree bark images using deterministic feature mapping"
authors = [
    {name = "Martin", email = "martin@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.0",
    "itsdangerous>=2.1.0",
]
# Only needed to BUILD new corpora (generates word embeddings).
# Pulls in torch; not required to run the CLI or the PWA, which load
# pre-built .npz corpora and use numpy/scipy only.
build = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[project.scripts]
barkprints = "barkprints.__main__:main"
barkprints-web = "barkprints.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/barkprints"]

[tool.hatch.build.targets.wheel.force-include]
"src/barkprints/web/static" = "barkprints/web/static"

# Install torch from the CPU-only wheel index (no NVIDIA CUDA libs).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

