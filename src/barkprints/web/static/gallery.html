<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3a2e" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/icon-192.png" />
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css" />
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css" />
<title>Barkprints — Saved</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ec; --fg: #1c1c1c; --muted: #6a6a6a;
    --accent: #1f3a2e; --card: #ffffff; --border: #e3ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f; --fg: #ece6d8; --muted: #9b9685;
      --accent: #8fb39a; --card: #1d2018; --border: #2c3026;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  a.nav { color: var(--accent); text-decoration: none; font-weight: 600; }
  p.tag { margin: 0 0 20px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
  }
  .card img {
    width: 100%; border-radius: 12px; display: block; margin-bottom: 12px;
    aspect-ratio: 4 / 3; object-fit: cover; background: var(--bg);
  }
  blockquote { margin: 0 0 12px; font-size: 19px; line-height: 1.4; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta .corpus { text-transform: capitalize; }
  .del {
    margin-left: auto; appearance: none; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .del:hover { color: #b3261e; border-color: #b3261e; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .error { color: #b3261e; }
  #map {
    height: min(45vh, 360px); width: 100%; border-radius: 16px; margin-bottom: 16px;
    border: 1px solid var(--border); display: none; background: var(--card);
  }
  #map.show { display: block; }
  /* Popups are compact previews (thumbnail + clamped text) so they always fit
     inside the map on a small phone screen; the "Show ↓" link jumps to the
     full card in the list below. Colors are fixed, not theme vars, because
     the popup bubble stays white even in dark mode. */
  .leaflet-popup-content { margin: 10px 12px; font: inherit; }
  .leaflet-popup-content img {
    width: 100%; height: 84px; border-radius: 8px; display: block;
    margin-bottom: 8px; object-fit: cover;
  }
  .leaflet-popup-content .pq {
    font-size: 13px; line-height: 1.35; margin: 0 0 6px;
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; overflow: hidden;
  }
  .leaflet-popup-content .pd {
    color: #6a6a6a; font-size: 12px;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px;
  }
  .leaflet-popup-content .pd a { color: #1f3a2e; text-decoration: none; font-weight: 600; }
  .card.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Saved barkprints</h1>
    <a class="nav" href="/">＋ New</a>
  </div>
  <p class="tag">Your kept tree thoughts.</p>
  <div id="map"></div>
  <div id="list"></div>
</main>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/static/barkmap.js"></script>
<script>
  const list = document.getElementById('list');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    } catch (e) { return iso; }
  }

  function mapLink(e) {
    if (e.lat == null || e.lon == null) return '';
    const la = Number(e.lat).toFixed(5), lo = Number(e.lon).toFixed(5);
    return `<a href="#map" class="mlink" data-id="${e.id}">📍 ${la}, ${lo}</a>`;
  }

  async function del(id, btn) {
    if (!confirm('Delete this saved barkprint?')) return;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/entries/${id}`, { method: 'DELETE' });
      if (res.ok) {
        btn.closest('.card').remove();
        if (!list.querySelector('.card')) renderEmpty();
      } else {
        btn.disabled = false;
      }
    } catch (e) { btn.disabled = false; }
  }

  function renderEmpty() {
    list.innerHTML = `<p class="empty">Nothing saved yet.<br><a class="nav" href="/">Make one →</a></p>`;
  }

  let map = null;
  let cluster = null;
  const markersById = new Map();
  function renderMap(entries) {
    const mapEl = document.getElementById('map');
    const located = entries.filter(e => e.lat != null && e.lon != null);
    if (!located.length) { mapEl.classList.remove('show'); return; }

    mapEl.classList.add('show');
    if (!map) {
      map = L.map(mapEl, { scrollWheelZoom: false });
      window.bpTileLayer().addTo(map);
      // Clustering keeps repeat photos of the same tree tappable: identical
      // coordinates spiderfy out on tap instead of stacking.
      cluster = L.markerClusterGroup({ maxClusterRadius: 40, showCoverageOnHover: false });
      map.addLayer(cluster);
    } else {
      cluster.clearLayers();
    }
    markersById.clear();

    const latlngs = [];
    for (const e of located) {
      const popup = `
        <img loading="lazy" src="${e.thumb_url || e.image_url}" alt="Saved bark photo" />
        <p class="pq">${escapeHtml(e.text)}</p>
        <div class="pd">
          <span>${escapeHtml(formatDate(e.created_at))}</span>
          <a href="#entry-${e.id}" class="plink" data-id="${e.id}">Show ↓</a>
        </div>`;
      const marker = L.marker([e.lat, e.lon]).bindPopup(popup, {
        maxWidth: 190, minWidth: 170, autoPanPadding: [12, 12],
      });
      cluster.addLayer(marker);
      markersById.set(e.id, marker);
      latlngs.push([e.lat, e.lon]);
    }
    if (latlngs.length === 1) {
      map.setView(latlngs[0], 16);
    } else {
      map.fitBounds(latlngs, { padding: [30, 30], maxZoom: 17 });
    }
    // The container starts hidden, so Leaflet may have measured it at 0px.
    setTimeout(() => map.invalidateSize(), 0);
  }

  function render(entries) {
    renderMap(entries);
    if (!entries.length) { renderEmpty(); return; }
    list.innerHTML = '';
    for (const e of entries) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `entry-${e.id}`;
      card.innerHTML = `
        <img loading="lazy" src="${e.thumb_url || e.image_url}" alt="Saved bark photo" />
        <blockquote>${escapeHtml(e.text)}</blockquote>
        <div class="meta">
          <span>${escapeHtml(formatDate(e.created_at))}</span>
          <span class="corpus">${escapeHtml(e.corpus || '')}</span>
          ${mapLink(e)}
          <button class="del" type="button">Delete</button>
        </div>`;
      card.querySelector('.del').addEventListener('click', (ev) => del(e.id, ev.target));
      list.appendChild(card);
    }
  }

  // Map ↔ list navigation. A popup's "Show ↓" closes the popup and scrolls
  // to the entry's card; a card's 📍 link scrolls to the map and opens the
  // entry's popup (unclustering as needed).
  document.addEventListener('click', (ev) => {
    const plink = ev.target.closest('.plink');
    if (plink) {
      ev.preventDefault();
      const card = document.getElementById(`entry-${plink.dataset.id}`);
      if (!card) return;
      if (map) map.closePopup();
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1600);
      return;
    }
    const mlink = ev.target.closest('.mlink');
    if (mlink) {
      ev.preventDefault();
      const marker = markersById.get(Number(mlink.dataset.id));
      if (!marker || !map) return;
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
      cluster.zoomToShowLayer(marker, () => marker.openPopup());
    }
  });

  async function load() {
    try {
      const res = await fetch('/api/entries');
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (!res.ok) { list.innerHTML = '<p class="error">Could not load saved entries.</p>'; return; }
      const data = await res.json();
      render(data.entries || []);
    } catch (err) {
      list.innerHTML = '<p class="error">Network error.</p>';
    }
  }

  load();
</script>
</body>
</html>
