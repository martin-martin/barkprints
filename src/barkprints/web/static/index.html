<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Barkprints" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/icon-192.png" />
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<title>Barkprints</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ec;
    --fg: #1c1c1c;
    --muted: #6a6a6a;
    --accent: #1f3a2e;
    --card: #ffffff;
    --border: #e3ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f;
      --fg: #ece6d8;
      --muted: #9b9685;
      --accent: #8fb39a;
      --card: #1d2018;
      --border: #2c3026;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: -0.01em;
  }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .topbar nav { display: flex; gap: 14px; white-space: nowrap; }
  .topbar nav a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
  p.tag { margin: 0 0 24px; color: var(--muted); }
  .save-row { margin-top: 16px; display: none; gap: 12px; align-items: center; flex-wrap: wrap; }
  .save-row.show { display: flex; }
  .save-row button {
    appearance: none; border: 1px solid var(--accent); background: var(--accent);
    color: white; font: 600 15px/1.2 inherit; padding: 12px 18px;
    border-radius: 12px; cursor: pointer;
  }
  .save-row button:disabled { opacity: 0.5; cursor: progress; }
  .geo { color: var(--muted); font-size: 13px; }
  .saved-ok { color: var(--accent); font-size: 14px; font-weight: 600; }
  .pickmap-wrap { width: 100%; margin-top: 12px; display: none; }
  .pickmap-wrap.show { display: block; }
  .pickmap-wrap .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  #pickmap {
    height: 220px; width: 100%; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  select, input[type=number] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .pick {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pick button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    font: 600 16px/1.2 inherit;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
  }
  .pick button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .pick button:disabled { opacity: 0.5; cursor: progress; }
  input[type=file] { display: none; }
  .preview {
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg);
    aspect-ratio: 4 / 3;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview.has-image { display: flex; }
  .result { min-height: 80px; }
  .result blockquote {
    margin: 0;
    padding: 0;
    font-size: 20px;
    line-height: 1.4;
  }
  .result ol { padding-left: 20px; margin: 0; }
  .result li { margin-bottom: 8px; }
  .score {
    display: inline-block;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    margin-right: 8px;
  }
  .error {
    color: #b3261e;
    font-size: 14px;
    margin-top: 8px;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>🌳 Barkprints 🌲</h1>
    <nav>
      <a href="/gallery">Saved</a>
      <a href="#" id="logout">Sign out</a>
    </nav>
  </div>
  <p class="tag">Thoughts written in tree bark.</p>

  <div class="card">
    <label for="corpus">Corpus</label>
    <select id="corpus"></select>
    <div class="row" style="margin-top: 16px;">
      <div>
        <label for="alpha">Bark influence <span id="alpha-val" class="score"></span></label>
        <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.5" />
        <small style="color: var(--muted);">flowing ↔ wild</small>
      </div>
      <div>
        <label for="maxwords">Max words</label>
        <input id="maxwords" type="number" min="1" max="200" value="20" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="pick">
      <button id="capture-btn" class="primary" type="button">Take a bark photo</button>
      <button id="upload-btn" type="button">Choose from library</button>
    </div>
    <input id="capture-input" type="file" accept="image/*" capture="environment" />
    <input id="upload-input" type="file" accept="image/*" />
    <div id="preview" class="preview"><img id="preview-img" alt="" /></div>
  </div>

  <div class="card result">
    <div id="result" aria-live="polite">
      <p style="color: var(--muted); margin: 0;">Pick an image to read tree thoughts.</p>
    </div>
    <div class="save-row" id="save-row">
      <button id="save-btn" type="button">Save this</button>
      <span class="geo" id="geo-status"></span>
    </div>
    <div class="pickmap-wrap" id="pickmap-wrap">
      <p class="hint">Drag the pin to the exact tree, or tap the map to place it.</p>
      <div id="pickmap"></div>
    </div>
  </div>

  <footer>Add to home screen for an app-like experience.</footer>
</main>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/barkmap.js"></script>
<script>
  const corpusSelect = document.getElementById('corpus');
  const alphaInput = document.getElementById('alpha');
  const alphaVal = document.getElementById('alpha-val');
  const maxWordsInput = document.getElementById('maxwords');
  const captureBtn = document.getElementById('capture-btn');
  const uploadBtn = document.getElementById('upload-btn');
  const captureInput = document.getElementById('capture-input');
  const uploadInput = document.getElementById('upload-input');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('preview-img');
  const resultEl = document.getElementById('result');
  const saveRow = document.getElementById('save-row');
  const saveBtn = document.getElementById('save-btn');
  const geoStatus = document.getElementById('geo-status');
  const pickMapWrap = document.getElementById('pickmap-wrap');
  const logoutLink = document.getElementById('logout');

  // The image currently shown and the text generated for it.
  let currentFile = null;
  let currentText = null;

  // Location state. `gpsGeo` is the raw device fix (with accuracy); `pickedGeo`
  // is the spot we'll actually save — seeded automatically but refinable by
  // dragging the pin. `pinSource` records where an auto-placed pin came from
  // ('exif' from the photo, which wins, or 'gps' from the device); `pinManual`
  // means the user moved it, so we stop auto-recentering and drop the accuracy.
  let gpsGeo = null;
  let pickedGeo = null;
  let pinSource = null;
  let pinManual = false;
  let pickMap = null;
  let pickMarker = null;

  const lastSettings = {
    corpus: localStorage.getItem('bp-corpus') || 'nature',
    alpha: localStorage.getItem('bp-alpha') || '0.5',
    maxWords: localStorage.getItem('bp-maxwords') || '20',
  };
  alphaInput.value = lastSettings.alpha;
  maxWordsInput.value = lastSettings.maxWords;
  const showAlpha = () => { alphaVal.textContent = Number(alphaInput.value).toFixed(2); };
  showAlpha();

  async function loadCorpora() {
    try {
      const res = await fetch('/api/corpora');
      if (res.status === 401) { window.location.href = '/login'; return; }
      const data = await res.json();
      corpusSelect.innerHTML = '';
      for (const c of data.corpora) {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.theme ? `${c.name} — ${c.theme}` : c.name;
        corpusSelect.appendChild(opt);
      }
      if ([...corpusSelect.options].some(o => o.value === lastSettings.corpus)) {
        corpusSelect.value = lastSettings.corpus;
      }
    } catch (err) {
      showError('Could not load corpora.');
    }
  }

  corpusSelect.addEventListener('change', () => {
    localStorage.setItem('bp-corpus', corpusSelect.value);
  });
  alphaInput.addEventListener('input', () => {
    showAlpha();
    localStorage.setItem('bp-alpha', alphaInput.value);
  });
  maxWordsInput.addEventListener('change', () => {
    localStorage.setItem('bp-maxwords', maxWordsInput.value);
  });

  captureBtn.addEventListener('click', () => captureInput.click());
  uploadBtn.addEventListener('click', () => uploadInput.click());
  // Clear the input after reading so picking the same photo again still
  // fires `change` (otherwise re-selecting an identical file does nothing).
  captureInput.addEventListener('change', e => { onFile(e.target.files[0]); e.target.value = ''; });
  uploadInput.addEventListener('change', e => { onFile(e.target.files[0]); e.target.value = ''; });

  function showError(msg) {
    resultEl.innerHTML = `<p class="error">${escapeHtml(msg)}</p>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function showLoading() {
    resultEl.innerHTML = `<p style="color: var(--muted); margin: 0;"><span class="spinner"></span>Listening to the bark…</p>`;
  }

  function renderText(text) {
    resultEl.innerHTML = `<blockquote>${escapeHtml(text)}</blockquote>`;
  }

  // Remember the last picked spot so the map opens somewhere useful even before
  // (or without) a GPS fix — e.g. on a second photo from the same walk.
  const FALLBACK_KEY = 'bp-lastloc';

  function fmt(lat, lon) {
    return `${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)}`;
  }

  function updateGeoStatus() {
    if (!pickedGeo) return;
    const c = fmt(pickedGeo.lat, pickedGeo.lon);
    if (pinManual) {
      geoStatus.textContent = `📍 ${c} (pinned)`;
    } else if (pinSource === 'exif') {
      geoStatus.textContent = `📍 ${c} (from photo) — drag to refine`;
    } else if (pinSource === 'gps' && gpsGeo) {
      geoStatus.textContent = `📍 ${c} (±${Math.round(gpsGeo.accuracy)}m) — drag to refine`;
    } else {
      geoStatus.textContent = `📍 ${c} (pinned)`;
    }
  }

  function fallbackCenter() {
    try {
      const raw = localStorage.getItem(FALLBACK_KEY);
      if (raw) {
        const [la, lo] = raw.split(',').map(Number);
        if (isFinite(la) && isFinite(lo)) return { center: [la, lo], zoom: 16 };
      }
    } catch (e) {}
    return { center: [20, 0], zoom: 2 };
  }

  function ensurePickMap() {
    if (pickMap) return;
    const fc = fallbackCenter();
    pickMap = L.map('pickmap', { scrollWheelZoom: false }).setView(fc.center, fc.zoom);
    window.bpTileLayer().addTo(pickMap);
    pickMap.on('click', (e) => setPin(e.latlng.lat, e.latlng.lng, true));
  }

  function showPicker() {
    pickMapWrap.classList.add('show');
    ensurePickMap();
    // The container was hidden, so Leaflet may have measured it at 0px.
    setTimeout(() => pickMap && pickMap.invalidateSize(), 0);
  }

  function resetPicker() {
    pickMapWrap.classList.remove('show');
    if (pickMarker && pickMap) pickMap.removeLayer(pickMarker);
    pickMarker = null;
  }

  function setPin(lat, lon, manual, source) {
    pickedGeo = { lat, lon };
    pinManual = manual;
    if (!manual) pinSource = source || null;
    ensurePickMap();
    if (!pickMarker) {
      pickMarker = L.marker([lat, lon], { draggable: true }).addTo(pickMap);
      pickMarker.on('dragend', () => {
        const ll = pickMarker.getLatLng();
        setPin(ll.lat, ll.lng, true);
      });
    } else {
      pickMarker.setLatLng([lat, lon]);
    }
    if (!manual) pickMap.setView([lat, lon], 17);
    try { localStorage.setItem(FALLBACK_KEY, `${lat},${lon}`); } catch (e) {}
    updateGeoStatus();
  }

  function requestLocation() {
    gpsGeo = null;
    pickedGeo = null;
    pinSource = null;
    pinManual = false;
    if (!('geolocation' in navigator)) {
      geoStatus.textContent = 'Location unavailable — tap the map to mark the tree.';
      return;
    }
    geoStatus.textContent = '📍 Locating… (or tap the map to set the spot)';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsGeo = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
        };
        // Auto-place from GPS unless the user pinned by hand, or the photo's
        // own EXIF location (more authoritative) already placed the pin.
        if (!pinManual && pinSource !== 'exif') setPin(gpsGeo.lat, gpsGeo.lon, false, 'gps');
      },
      () => {
        if (!pinManual) geoStatus.textContent = 'Location off — tap the map to mark the tree.';
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  async function onFile(file) {
    if (!file) return;
    currentFile = file;
    currentText = null;
    saveRow.classList.remove('show');
    resetPicker();
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    preview.classList.add('has-image');

    // Grab the location now — the user is standing at the tree.
    requestLocation();

    const fd = new FormData();
    fd.append('image', file);
    fd.append('corpus', corpusSelect.value);
    fd.append('alpha', alphaInput.value);
    fd.append('max_words', maxWordsInput.value);

    showLoading();
    captureBtn.disabled = uploadBtn.disabled = true;
    try {
      const res = await fetch('/api/generate', { method: 'POST', body: fd });
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showError(err.detail || `Server error (${res.status})`);
        return;
      }
      const data = await res.json();
      currentText = data.text;
      renderText(data.text);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save this';
      saveRow.classList.add('show');
      showPicker();
      // The photo's own GPS tag, if any, beats the device fix — especially for
      // a library photo taken somewhere other than where you're standing now.
      if (!pinManual && typeof data.exif_lat === 'number' && typeof data.exif_lon === 'number') {
        setPin(data.exif_lat, data.exif_lon, false, 'exif');
      }
    } catch (err) {
      showError('Network error. Try again.');
    } finally {
      captureBtn.disabled = uploadBtn.disabled = false;
    }
  }

  async function onSave() {
    if (!currentFile || !currentText) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    const fd = new FormData();
    fd.append('image', currentFile);
    fd.append('text', currentText);
    fd.append('corpus', corpusSelect.value);
    fd.append('alpha', alphaInput.value);
    fd.append('max_words', maxWordsInput.value);
    if (pickedGeo) {
      fd.append('lat', pickedGeo.lat);
      fd.append('lon', pickedGeo.lon);
      // Accuracy only describes an un-moved GPS fix; a hand-placed pin is exact
      // and an EXIF location carries no radius.
      if (!pinManual && pinSource === 'gps' && gpsGeo && gpsGeo.accuracy != null) {
        fd.append('accuracy', gpsGeo.accuracy);
      }
    }
    try {
      const res = await fetch('/api/save', { method: 'POST', body: fd });
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save this';
        geoStatus.innerHTML = `<span class="error">${escapeHtml(err.detail || 'Save failed')}</span>`;
        return;
      }
      saveBtn.textContent = 'Saved ✓';
      geoStatus.innerHTML = '<a href="/gallery" class="saved-ok">View in Saved →</a>';
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save this';
      geoStatus.innerHTML = '<span class="error">Network error. Try again.</span>';
    }
  }

  saveBtn.addEventListener('click', onSave);
  logoutLink.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await fetch('/api/logout', { method: 'POST' }); } catch (err) {}
    window.location.href = '/login';
  });

  loadCorpora();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
