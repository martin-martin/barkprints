<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3a2e" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<title>Barkprints — Sign in</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ec; --fg: #1c1c1c; --muted: #6a6a6a;
    --accent: #1f3a2e; --card: #ffffff; --border: #e3ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f; --fg: #ece6d8; --muted: #9b9685;
      --accent: #8fb39a; --card: #1d2018; --border: #2c3026;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 26px; margin: 0 0 4px; text-align: center; }
  p.tag { margin: 0 0 24px; color: var(--muted); text-align: center; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
  }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--fg); font: inherit;
  }
  button {
    width: 100%; margin-top: 20px; appearance: none; border: none;
    background: var(--accent); color: white; font: 600 16px/1.2 inherit;
    padding: 14px; border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  .error { color: #b3261e; font-size: 14px; margin-top: 12px; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>🌳 Barkprints 🌲</h1>
  <p class="tag">Sign in to read and keep tree thoughts.</p>
  <form class="card" id="form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button id="submit" type="submit">Sign in</button>
    <div class="error" id="error" aria-live="polite"></div>
  </form>
</main>
<script>
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const errorEl = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    submit.disabled = true;
    try {
      const fd = new FormData(form);
      const res = await fetch('/api/login', { method: 'POST', body: fd });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.detail || `Sign in failed (${res.status})`;
    } catch (err) {
      errorEl.textContent = 'Network error. Try again.';
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
